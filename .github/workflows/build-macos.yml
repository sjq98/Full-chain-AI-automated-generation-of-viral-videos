name: Build macOS Package

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-macos:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x64
          - runner: macos-15
            arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install FFmpeg
        run: |
          brew untap aws/tap || true
          brew install --formula ffmpeg

      - name: Prepare build environment
        run: |
          python -m venv .build-venv
          .build-venv/bin/python -m pip install --upgrade pip
          .build-venv/bin/python -m pip install pyinstaller tos yt-dlp
          .build-venv/bin/python -m pip install -r requirements.txt
          .build-venv/bin/python -m pip install -r vendor/MediaCrawler/requirements.txt

      - name: Prepare bundled FFmpeg
        run: |
          mkdir -p bin
          cp "$(which ffmpeg)" bin/ffmpeg
          cp "$(which ffprobe)" bin/ffprobe
          chmod +x bin/ffmpeg bin/ffprobe

      - name: Build self-contained backend tools
        run: |
          .build-venv/bin/python build_release.py
          test ! -e desktop/resources/backend/user-settings.json
          test ! -e desktop/resources/backend/data

      - name: Install Electron dependencies
        working-directory: desktop
        run: npm ci

      - name: Build Electron app
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --mac dmg zip --${{ matrix.arch }} --publish never --config.mac.identity=-

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: mp4-golden-clip-workbench-macos-${{ matrix.arch }}
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/latest-mac.yml
          if-no-files-found: error
