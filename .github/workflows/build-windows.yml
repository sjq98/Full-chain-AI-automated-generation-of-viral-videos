name: Build Windows Installer

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Windows x64
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            vendor/publishers/xhs-mcp/package-lock.json

      - name: Install FFmpeg
        shell: pwsh
        run: |
          choco install ffmpeg -y --no-progress
          New-Item -ItemType Directory -Force bin | Out-Null
          Copy-Item (Get-Command ffmpeg).Source bin\ffmpeg.exe
          if (Get-Command ffprobe -ErrorAction SilentlyContinue) {
            Copy-Item (Get-Command ffprobe).Source bin\ffprobe.exe
          }

      - name: Install Python build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r vendor/MediaCrawler/requirements.txt pyinstaller tos yt-dlp

      - name: Build the Xiaohongshu publisher runtime
        working-directory: vendor/publishers/xhs-mcp
        run: |
          npm ci --ignore-scripts
          npm run build

      - name: Build bundled backend tools
        run: python build_release.py

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Build Windows installer
        working-directory: desktop
        run: npm run dist

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: mp4-golden-clip-workbench-windows-x64
          path: desktop/dist/MP4-Golden-Clip-Workbench-*.exe
          if-no-files-found: error
